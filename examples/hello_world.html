<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lozza Hello World</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #dump { background: #fff; color: #000; padding: 1rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Lozza Hello World</h1>
  <pre id="dump"></pre>

  <script>
    const dump = document.getElementById('dump');
    const lozza = new Worker('../lozza.js');

    lozza.onmessage = function (e) {
      dump.textContent += e.data + '\n';
    };

    lozza.postMessage('uci');
    lozza.postMessage('ucinewgame');
    lozza.postMessage('position startpos');
    lozza.postMessage('go depth 10');
  </script>
</body>
</html>
